name: Validate branch name

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$BRANCH" = "dev" ]; then
            exit 0
          fi
          pattern='^(feat|fix|refactor|perf|docs|test|build|ci|chore|revert)/(GH-[0-9]+|NO-ISSUE)/[a-z0-9._-]+$'
          if [ "${#BRANCH}" -gt 50 ]; then
            echo "Branch name is longer than 50 characters: $BRANCH"
            exit 1
          fi
          if ! echo "$BRANCH" | grep -Eq "$pattern"; then
            echo "Invalid branch name: $BRANCH"
            echo "Expected {type}/GH-{issue}/{kebab-description}, e.g. feat/GH-12/fluid-pipes"
            exit 1
          fi
