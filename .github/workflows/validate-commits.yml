name: Validate commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit messages
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|refactor|perf|docs|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: [a-z].{0,60}[^.]$'
          failed=0
          while IFS= read -r subject; do
            case "$subject" in
              Merge*|Revert*) continue ;;
            esac
            if ! echo "$subject" | grep -Eq "$pattern"; then
              echo "Invalid commit message: $subject"
              echo "Expected: type(scope): short imperative summary"
              failed=1
            fi
          done < <(git log --format=%s "$BASE..$HEAD")
          exit $failed
