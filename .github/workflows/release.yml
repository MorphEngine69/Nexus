name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Verify tag matches the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$version"
            exit 1
          fi

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md." > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            nexus-neoforge/build/libs/*.jar
            !nexus-neoforge/build/libs/*-sources.jar
