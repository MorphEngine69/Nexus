name: Release

# A release is a tag named {loader}-{minecraft}-v{version}, for example
# neoforge-26.2-v1.0.0-beta.1. The version is the mod_version of gradle.properties; one with a
# hyphen, such as 1.0.0-beta.1, is published as a pre-release.
on:
  push:
    tags: ['neoforge-*-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify the tag matches the project
        id: version
        run: |
          version="${GITHUB_REF_NAME##*-v}"
          target="${GITHUB_REF_NAME%-v*}"
          project_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          if [ "$version" != "$project_version" ]; then
            echo "Tag $GITHUB_REF_NAME has version $version, but mod_version=$project_version"
            exit 1
          fi
          if [ "$target" != "neoforge-$minecraft" ]; then
            echo "Tag $GITHUB_REF_NAME targets $target, but this branch builds neoforge-$minecraft"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Extract changelog section
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md." > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
