mod_description=Network storage and automation. One controller, the Nexus, ties cables, Energy Cells, generators and machines, Storage Vaults and terminals into a network that stores items, fluids and FE, and crafts, moves and places things for you.\n\nRun as many independent networks as you like, each with its own name, color and list of people who may use it. Power them with coal, lava, steam, biofuel or nether stars, work Steel, Cobalt, Mithril and Hellsteel into tools and armor, carry a charged terminal with you, and see what every device draws and does with the Nexus Analyser and the energy tab.